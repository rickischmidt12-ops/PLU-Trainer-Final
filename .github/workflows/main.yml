name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="PLU-Release-v1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEHLER: ZIP-Datei wurde nicht gefunden."
            exit 1
          fi

          rm -rf app-source
          mkdir -p app-source
          unzip -q "$ZIP_FILE" -d app-source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find app-source -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "FEHLER: Kein Android/Gradle-Projekt gefunden."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle-Projekt gefunden:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          keytool \
            -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug-Keystore erstellt."

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          echo "Starte Android-Build..."
          gradle --no-daemon clean assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          APK_FILE=$(find app-source -type f -name "*.apk" -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "FEHLER: Build war fertig, aber keine APK wurde gefunden."
            exit 1
          fi

          echo "APK gefunden:"
          echo "$APK_FILE"

          cp "$APK_FILE" apk-output/PLU-Trainer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLU-Trainer-APK
          path: apk-output/PLU-Trainer.apk
          if-no-files-found: error
