name: Build Android Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="PLU-Release-v1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEHLER: ZIP-Datei wurde nicht gefunden."
            exit 1
          fi

          rm -rf app-source
          mkdir -p app-source
          unzip -q "$ZIP_FILE" -d app-source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find app-source -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "FEHLER: Kein Android/Gradle-Projekt gefunden."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle-Projekt gefunden:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        shell: bash
        env:
          PLU_KEYSTORE_BASE64: ${{ secrets.PLU_KEYSTORE_BASE64 }}
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          if [ -z "$PLU_KEYSTORE_BASE64" ]; then
            echo "FEHLER: PLU_KEYSTORE_BASE64 fehlt."
            exit 1
          fi

          echo "$PLU_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/app/plu-upload-key.jks"

          echo "Release-Keystore wurde bereitgestellt."

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build signed release AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.project.outputs.project_dir }}/app/plu-upload-key.jks
          STORE_PASSWORD: ${{ secrets.PLU_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLU_KEY_PASSWORD }}
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ -z "$STORE_PASSWORD" ]; then
            echo "FEHLER: PLU_STORE_PASSWORD fehlt."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "FEHLER: PLU_KEY_PASSWORD fehlt."
            exit 1
          fi

          echo "Starte signierten Release-Build..."
          gradle --no-daemon clean bundleRelease

      - name: Collect AAB
        shell: bash
        run: |
          set -e

          mkdir -p aab-output

          AAB_FILE=$(find app-source -type f -name "*.aab" -print -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "FEHLER: Build war fertig, aber keine AAB wurde gefunden."
            exit 1
          fi

          echo "AAB gefunden:"
          echo "$AAB_FILE"

          cp "$AAB_FILE" aab-output/PLU-v1.0.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PLU-PlayStore-AAB
          path: aab-output/PLU-v1.0.aab
          if-no-files-found: error
